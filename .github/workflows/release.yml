name: Crear instalador de Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar el instalador
        run: npm run dist
      - name: Guardar el EXE como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Hone-Optimizador-Installer-${{ github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error
      - name: Adjuntar el EXE al release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          name: Hone Optimizador ${{ github.ref_name }}
          body: Instalador de Windows para Hone Optimizador.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
